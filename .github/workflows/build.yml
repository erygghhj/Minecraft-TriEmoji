name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    name: resource pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade Pillow requests
      - name: build pack + tables
        run: python tools/build_unified.py --out dist
      - name: sync tables into plugin resources
        run: |
          cp dist/ios.txt dist/android.txt dist/windows.txt emoji-plugin-modern/src/main/resources/
          cp dist/ios.txt dist/android.txt dist/windows.txt emoji-plugin-legacy/src/main/resources/
      - uses: actions/upload-artifact@v4
        with:
          name: resource-packs
          path: |
            dist/Universal_Emoji.zip
            dist/Universal_Emoji_legacy.zip
            dist/manifest.json

  plugin:
    name: plugin (JDK 21)
    runs-on: ubuntu-latest
    needs: pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resource-packs
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: compile + unit tests
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            emoji-plugin-modern/target/UniversalEmoji-*.jar
            emoji-plugin-legacy/target/UniversalEmoji-Legacy-*.jar

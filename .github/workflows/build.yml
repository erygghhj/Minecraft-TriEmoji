name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    name: resource pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade Pillow requests
      - name: build pack + tables
        run: python tools/build_unified.py --out dist
      - name: sync tables into plugin resources
        run: |
          for m in emoji-plugin-modern emoji-plugin-legacy emoji-plugin-spigot; do
            cp dist/ios.txt dist/android.txt dist/windows.txt "$m/src/main/resources/"
          done
      - name: sync pack sha1 into the default configs
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          m = json.loads(pathlib.Path("dist/manifest.json").read_text())
          ms, ls = m["packs"]["modern"]["sha1"], m["packs"]["legacy"]["sha1"]
          for p, sha in [
              ("emoji-plugin-modern/src/main/resources/config.yml", ms),
              ("emoji-plugin-spigot/src/main/resources/config.yml", ms),
              ("emoji-plugin-legacy/src/main/resources/config.yml", ls),
          ]:
              f = pathlib.Path(p)
              f.write_text(re.sub(r'sha1: "\w+"', f'sha1: "{sha}"', f.read_text()))
          print("modern", ms)
          print("legacy", ls)
          PY
      - name: print checksums
        run: sha1sum dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: resource-packs
          path: |
            dist/Universal_Emoji.zip
            dist/Universal_Emoji_legacy.zip
            dist/manifest.json

  plugin:
    name: plugin (JDK 21)
    runs-on: ubuntu-latest
    needs: pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resource-packs
          path: dist
      - name: restore config sha1 from the freshly built pack
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          m = json.loads(pathlib.Path("dist/manifest.json").read_text())
          ms, ls = m["packs"]["modern"]["sha1"], m["packs"]["legacy"]["sha1"]
          for p, sha in [
              ("emoji-plugin-modern/src/main/resources/config.yml", ms),
              ("emoji-plugin-spigot/src/main/resources/config.yml", ms),
              ("emoji-plugin-legacy/src/main/resources/config.yml", ls),
          ]:
              f = pathlib.Path(p)
              f.write_text(re.sub(r'sha1: "\w+"', f'sha1: "{sha}"', f.read_text()))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: compile + package
        run: mvn -B package
      - name: add the spigot naming variant of the legacy jar
        run: |
          set -e
          src=$(ls emoji-plugin-legacy/target/UniversalEmoji-Paper-Legacy-*.jar)
          dst=${src/Paper-Legacy/Spigot-Legacy}
          cp "$src" "$dst"
          ls -l "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            emoji-plugin-modern/target/UniversalEmoji-Paper-1.20+-*.jar
            emoji-plugin-spigot/target/UniversalEmoji-Spigot-1.20+-*.jar
            emoji-plugin-legacy/target/UniversalEmoji-Paper-Legacy-*.jar
            emoji-plugin-legacy/target/UniversalEmoji-Spigot-Legacy-*.jar

  # Pushing a v* tag is all it takes from here on: the two jobs above build
  # everything, this one publishes it. No manual re-upload of jars or packs.
  release:
    name: publish
    runs-on: ubuntu-latest
    needs: [pack, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resource-packs
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: artifacts
      - name: collect deliverables
        run: |
          mkdir -p out
          find artifacts -name '*.jar' -exec cp {} out/ \;
          cp dist/*.zip out/
          ls -l out/
          sha1sum out/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            out/*.jar
            out/*.zip

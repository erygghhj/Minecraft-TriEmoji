name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The packs in dist/ are the single source of truth: their SHA-1 is what every
# jar ships as the default, what the CDN serves, and what the release carries.
# Rebuilding the atlas inside CI would give the same pixels but a different zip
# byte stream (timestamps), and then a jar from the release would reject a pack
# from the CDN. So CI verifies and reuses them, it does not regenerate them.
# Run `python tools/build_unified.py --out dist` locally when the artwork,
# tables or pack.mcmeta actually change, then commit the result.

jobs:
  verify:
    name: verify packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: packs are present and match every default config
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          dist = pathlib.Path("dist")
          manifest = json.loads((dist / "manifest.json").read_text())
          bad = []
          for kind, cfg in [
              ("modern", ["emoji-plugin-modern/src/main/resources/config.yml",
                          "emoji-plugin-spigot/src/main/resources/config.yml"]),
              ("legacy", ["emoji-plugin-legacy/src/main/resources/config.yml"]),
          ]:
              pack = dist / manifest["packs"][kind]["file"]
              data = pack.read_bytes()
              sha = hashlib.sha1(data).hexdigest()
              size = len(data)
              ok_sha = manifest["packs"][kind]["sha1"] == sha
              ok_size = manifest["packs"][kind]["size"] == size
              print(f"{pack.name}: {size}B sha1={sha} manifest_ok={ok_sha and ok_size}")
              if not (ok_sha and ok_size):
                  bad.append(f"manifest mismatch for {pack.name}")
              for c in cfg:
                  text = pathlib.Path(c).read_text()
                  if f'sha1: "{sha}"' not in text:
                      bad.append(f"{c} does not carry {sha}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all packs consistent")
          PY
      - name: print the pack mcmeta of both packs
        run: |
          python3 - <<'PY'
          import json, zipfile, pathlib
          for f in sorted(pathlib.Path("dist").glob("*.zip")):
              z = zipfile.ZipFile(f)
              print(f.name, json.loads(z.read("pack.mcmeta"))["pack"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resource-packs
          path: |
            dist/Universal_Emoji.zip
            dist/Universal_Emoji_legacy.zip
            dist/manifest.json

  plugin:
    name: plugin (JDK 21)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: compile + package
        run: mvn -B package
      - name: every jar carries the same pack sha1 as dist
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, sys
          modern = hashlib.sha1(pathlib.Path("dist/Universal_Emoji.zip").read_bytes()).hexdigest()
          legacy = hashlib.sha1(pathlib.Path("dist/Universal_Emoji_legacy.zip").read_bytes()).hexdigest()
          expected = {"modern": modern, "legacy": legacy}
          bad = []
          for jar in sorted(pathlib.Path(".").glob("emoji-plugin-*/target/*.jar")):
              z = zipfile.ZipFile(jar)
              if "config.yml" not in z.namelist():
                  continue
              text = z.read("config.yml").decode()
              kind = "legacy" if "legacy" in jar.parent.parent.name or "Legacy" in jar.name else "modern"
              if f'sha1: "{expected[kind]}"' not in text:
                  bad.append(f"{jar.name} does not carry the {kind} sha1")
              else:
                  print(f"{jar.name}: {kind} sha1 ok")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY
      - name: add the spigot naming variant of the legacy jar
        run: |
          set -e
          src=$(ls emoji-plugin-legacy/target/UniversalEmoji-Paper-Legacy-*.jar)
          dst=${src/Paper-Legacy/Spigot-Legacy}
          cp "$src" "$dst"
          ls -l "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            emoji-plugin-modern/target/UniversalEmoji-Paper-1.20+-*.jar
            emoji-plugin-spigot/target/UniversalEmoji-Spigot-1.20+-*.jar
            emoji-plugin-legacy/target/UniversalEmoji-Paper-Legacy-*.jar
            emoji-plugin-legacy/target/UniversalEmoji-Spigot-Legacy-*.jar

  # Pushing a v* tag is all it takes from here on: the jobs above build
  # everything, this one publishes it. No manual re-upload of jars or packs.
  release:
    name: publish
    runs-on: ubuntu-latest
    needs: [verify, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resource-packs
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: artifacts
      - name: collect deliverables
        run: |
          mkdir -p out
          find artifacts -name '*.jar' -exec cp {} out/ \;
          cp dist/*.zip out/
          ls -l out/
          sha1sum out/*.zip
      # Only runs when both secrets are configured, so a missing token never
      # turns the whole pipeline red.
      - name: publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            out/UniversalEmoji-Paper-1.20+-*.jar
            out/UniversalEmoji-Spigot-1.20+-*.jar
            out/UniversalEmoji-Paper-Legacy-*.jar
            out/UniversalEmoji-Spigot-Legacy-*.jar
            out/Universal_Emoji.zip
            out/Universal_Emoji_legacy.zip
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: paper spigot bukkit
          game-versions: |
            1.13
            1.13.1
            1.13.2
            1.14
            1.14.1
            1.14.2
            1.14.3
            1.14.4
            1.15
            1.15.1
            1.15.2
            1.16
            1.16.1
            1.16.2
            1.16.3
            1.16.4
            1.16.5
            1.17
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          changelog: |
            See https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            out/*.jar
            out/*.zip
